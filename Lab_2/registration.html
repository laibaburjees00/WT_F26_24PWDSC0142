
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Student Registration Form</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="profile.html">About</a>
        <a href="schedule.html">Courses</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
<section>

<h2>Register Here</h2>

<form action="#" method="post">

    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name"
           placeholder="Enter your name" required>

    <label for="reg">Registration Number:</label>
    <input type="text" id="reg" name="registration"
           placeholder="Enter registration number" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"
           placeholder="Enter your email" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password"
           minlength="8" required>

    <label for="course">Select Course:</label>

    <select id="course" name="course" required>
        <option value="">Choose a course</option>
        <option>Web Technologies</option>
        <option>Data Science</option>
        <option>Database Systems</option>
        <option>Programming</option>
    </select>

    <p>Select Semester:</p>

    <input type="radio" name="semester" value="1" required> 1st
    <input type="radio" name="semester" value="2"> 2nd
    <input type="radio" name="semester" value="3"> 3rd
    <input type="radio" name="semester" value="4"> 4th

    <p>
        <input type="checkbox" name="terms" required>
        I agree to the terms and conditions.
    </p>

    <button type="submit">Submit Registration</button>

</form>

</section>
</main>

<footer>UET Peshawar | CS 224L</footer>

</body>
</html>
