<html>
    <head>
        <title> CSS  Basics</title>
        <style>
            body{
                margin: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: #f0f0f0;
            }
            .rounded-image {
                width: 200px;   
                height: 200px;
                overflow: hidden;
                border-radius: 70%;
                margin-left: 10px;
            }
            img {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <h1> WELCOME TO WEB DEVELOPMENT</h1>
        <div class="rounded-image">
            <img src="img.jpg" alt="Rounded Image">
        </div>
    </body>     
</html>
